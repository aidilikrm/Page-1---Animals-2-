<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page 1 - Animals AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- A-Frame Extras - supports animated GLB models -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.1/dist/aframe-extras.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        a-scene {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        a-scene canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        video {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }

        #title {
            position: fixed;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 10;
            text-shadow: 2px 2px 4px black;
            pointer-events: none;
        }

        #title h2 {
            margin: 5px;
        }

        #title p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- Title -->
    <div id="title">
        <h2>Page 1 - Animals AR</h2>
        <p>Point your camera at an animal picture</p>
    </div>


    <a-scene
        mindar-image="imageTargetSrc: ./page1-targets.mind;"
        embedded
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- ========================= -->
        <!-- 3D MODELS -->
        <!-- ========================= -->

        <a-assets>

            <!-- Jellyfish -->
            <a-asset-item
                id="jellyfishModel"
                src="./jellyfish-model.glb">
            </a-asset-item>

            <!-- Sheep -->
            <a-asset-item
                id="sheepModel"
                src="./sheep-model.glb">
            </a-asset-item>

            <!-- Snake -->
            <a-asset-item
                id="snakeModel"
                src="./snake-model.glb">
            </a-asset-item>

        </a-assets>


        <!-- ========================= -->
        <!-- TARGET 0 = JELLYFISH -->
        <!-- ========================= -->

        <a-entity mindar-image-target="targetIndex: 0">

            <a-gltf-model
                src="#jellyfishModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer>
            </a-gltf-model>

        </a-entity>


        <!-- ========================= -->
        <!-- TARGET 1 = SHEEP -->
        <!-- ========================= -->

        <a-entity mindar-image-target="targetIndex: 1">

            <a-gltf-model
                src="#sheepModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer>
            </a-gltf-model>

        </a-entity>


        <!-- ========================= -->
        <!-- TARGET 2 = SNAKE -->
        <!-- ========================= -->

        <a-entity mindar-image-target="targetIndex: 2">

            <a-gltf-model
                src="#snakeModel"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1"
                animation-mixer>
            </a-gltf-model>

        </a-entity>


        <!-- Camera -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

    </a-scene>

</body>
</html>
